<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - Lab Management System</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .box h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .box p {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 30px;
    }
    .form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .form input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    .form button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .form button:hover {
      background: #5568d3;
    }
    .form button:disabled {
      background: #95a5a6;
      cursor: not-allowed;
    }
    .form button .spinner-btn {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .result-box {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 8px;
      font-size: 14px;
      word-break: break-all;
    }
    .result-box.success {
      display: block;
      background: #d5f4e6;
      color: #27ae60;
      border: 1px solid #a3e4c1;
    }
    .result-box.error {
      display: block;
      background: #fee;
      color: #e74c3c;
      border: 1px solid #f5c6cb;
    }
    .result-box .reset-link-box {
      margin-top: 15px;
      padding: 10px;
      background: white;
      border-radius: 5px;
      border: 1px dashed #27ae60;
    }
    .result-box .reset-link-box a {
      color: #27ae60;
      font-weight: bold;
      text-decoration: none;
    }
    .result-box .reset-link-box a:hover {
      text-decoration: underline;
    }
    .info-note {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 5px;
      font-size: 13px;
      color: #495057;
    }
    .info-note strong {
      display: block;
      margin-bottom: 5px;
      color: #2c3e50;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Lupa Password</h1>
      <p>Masukkan username untuk mereset password</p>

      <form class="form" onsubmit="handleForgotPassword(event)">
        <input type="text" id="username" placeholder="Username" required autocomplete="username">
        <button type="submit" id="btnSubmit">Kirim</button>
      </form>

      <div id="result" class="result-box"></div>

      <a href="/" class="back-link">← Kembali ke Login</a>

      <div class="info-note">
        <strong>📝 Catatan:</strong>
        <div>Link reset password akan muncul di console server (development mode)</div>
      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script>
    async function handleForgotPassword(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const btn = document.getElementById('btnSubmit');
      const result = document.getElementById('result');

      if (!username) {
        result.className = 'result-box error';
        result.textContent = 'Username harus diisi';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-btn"></span> Mengirim...';
      result.className = 'result-box';
      result.textContent = '';

      try {
        const response = await fetch(API_URL + '/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        const data = await response.json();

        if (data.success) {
          result.className = 'result-box success';
          if (data.resetLink) {
            result.innerHTML = '<div>Link reset password berhasil dibuat:</div>' +
              '<div class="reset-link-box">' +
              '<a href="' + data.resetLink + '" target="_blank">Klik di sini untuk reset password</a>' +
              '</div>' +
              '<div style="margin-top:10px;font-size:12px;">Atau buka link berikut: ' + data.resetLink + '</div>';
          } else {
            result.textContent = data.message || 'Permintaan reset password berhasil diproses';
          }
        } else {
          result.className = 'result-box error';
          result.textContent = data.error || 'Terjadi kesalahan';
        }
      } catch (error) {
        console.error('Forgot password error:', error);
        result.className = 'result-box error';
        result.textContent = 'Terjadi kesalahan: ' + error.message;
      }

      btn.disabled = false;
      btn.innerHTML = 'Kirim';
    }
  </script>
</body>
</html>
