<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password — Lab Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .auth-box .spinner-btn {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>Lupa Password</h1>
      <p>Masukkan username untuk mereset password</p>

      <form class="form" onsubmit="handleForgotPassword(event)">
        <input type="text" id="username" placeholder="Username" required autocomplete="username" style="width:100%;">
        <button type="submit" id="btnSubmit">Kirim Link Reset</button>
      </form>

      <div id="result" class="auth-result-box"></div>

      <a href="/" class="auth-back-link">← Kembali ke Login</a>

      <div class="auth-note">
        <strong>📝 Catatan:</strong>
        <div>Link reset password akan muncul di halaman ini (untuk development)</div>
      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script>
    async function handleForgotPassword(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const btn = document.getElementById('btnSubmit');
      const result = document.getElementById('result');

      if (!username) {
        result.className = 'auth-result-box error';
        result.textContent = 'Username harus diisi';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-btn"></span> Mengirim...';
      result.className = 'auth-result-box';
      result.textContent = '';

      try {
        const response = await fetch(API_URL + '/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        const data = await response.json();

        if (data.success) {
          result.className = 'auth-result-box success';
          if (data.resetLink) {
            result.innerHTML = '<div style="margin-bottom:8px;">Link reset password berhasil dibuat:</div>' +
              '<div class="reset-link-box">' +
              '<a href="' + data.resetLink + '" target="_blank">Klik di sini untuk reset password</a>' +
              '</div>' +
              '<div style="margin-top:10px;font-size:12px;word-break:break-all;">Atau buka link: ' + data.resetLink + '</div>';
          } else {
            result.textContent = data.message || 'Permintaan reset password berhasil diproses';
          }
        } else {
          result.className = 'auth-result-box error';
          result.textContent = data.error || 'Terjadi kesalahan';
        }
      } catch (error) {
        console.error('Forgot password error:', error);
        result.className = 'auth-result-box error';
        result.textContent = 'Terjadi kesalahan: ' + error.message;
      }

      btn.disabled = false;
      btn.innerHTML = 'Kirim Link Reset';
    }
  </script>
</body>
</html>
