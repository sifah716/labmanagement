<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Lab Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .auth-box .spinner-btn {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>Reset Password</h1>
      <p>Masukkan password baru Anda</p>

      <form class="form" onsubmit="handleResetPassword(event)" id="resetForm">
        <input type="password" id="password" placeholder="Password baru" required minlength="6" autocomplete="new-password" style="width:100%;">
        <input type="password" id="confirmPassword" placeholder="Konfirmasi password" required minlength="6" autocomplete="new-password" style="width:100%;">
        <div class="password-hint">Minimal 6 karakter</div>
        <button type="submit" id="btnSubmit">Reset Password</button>
      </form>

      <div id="message" class="auth-message"></div>

      <a href="/" class="auth-back-link">← Kembali ke Login</a>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script>
    // Ambil token dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('message').className = 'auth-message error';
      document.getElementById('message').textContent = 'Token reset password tidak ditemukan. Silakan ulangi proses lupa password.';
    }

    async function handleResetPassword(e) {
      e.preventDefault();

      if (!token) {
        document.getElementById('message').className = 'auth-message error';
        document.getElementById('message').textContent = 'Token tidak valid';
        return;
      }

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('btnSubmit');
      const message = document.getElementById('message');

      if (password.length < 6) {
        message.className = 'auth-message error';
        message.textContent = 'Password minimal 6 karakter';
        return;
      }

      if (password !== confirmPassword) {
        message.className = 'auth-message error';
        message.textContent = 'Konfirmasi password tidak cocok';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-btn"></span> Mereset...';
      message.className = 'auth-message';
      message.textContent = '';

      try {
        const response = await fetch(API_URL + '/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });

        const data = await response.json();

        if (data.success) {
          message.className = 'auth-message success';
          message.innerHTML = '✓ ' + data.message + '<br><br><a href="/" style="color:var(--success);font-weight:700;">Klik di sini untuk login</a>';
          document.getElementById('resetForm').style.display = 'none';
        } else {
          message.className = 'auth-message error';
          message.textContent = data.error || 'Terjadi kesalahan';
          btn.disabled = false;
          btn.innerHTML = 'Reset Password';
        }
      } catch (error) {
        console.error('Reset password error:', error);
        message.className = 'auth-message error';
        message.textContent = 'Terjadi kesalahan: ' + error.message;
        btn.disabled = false;
        btn.innerHTML = 'Reset Password';
      }
    }
  </script>
</body>
</html>
