<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Lab Management System</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .box h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .box p {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 30px;
    }
    .form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .form input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    .form button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .form button:hover {
      background: #5568d3;
    }
    .form button:disabled {
      background: #95a5a6;
      cursor: not-allowed;
    }
    .form button .spinner-btn {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
    .message.success {
      display: block;
      background: #d5f4e6;
      color: #27ae60;
      border: 1px solid #a3e4c1;
    }
    .message.error {
      display: block;
      background: #fee;
      color: #e74c3c;
      border: 1px solid #f5c6cb;
    }
    .password-info {
      margin-top: -10px;
      margin-bottom: 15px;
      font-size: 12px;
      color: #7f8c8d;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Reset Password</h1>
      <p>Masukkan password baru Anda</p>

      <form class="form" onsubmit="handleResetPassword(event)">
        <input type="password" id="password" placeholder="Password baru" required minlength="6" autocomplete="new-password">
        <input type="password" id="confirmPassword" placeholder="Konfirmasi password" required minlength="6" autocomplete="new-password">
        <div class="password-info">Minimal 6 karakter</div>
        <button type="submit" id="btnSubmit">Reset Password</button>
      </form>

      <div id="message" class="message"></div>

      <a href="/" class="back-link">← Kembali ke Login</a>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script>
    // Ambil token dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('message').className = 'message error';
      document.getElementById('message').textContent = 'Token reset password tidak ditemukan. Silakan ulangi proses lupa password.';
    }

    async function handleResetPassword(e) {
      e.preventDefault();

      if (!token) {
        document.getElementById('message').className = 'message error';
        document.getElementById('message').textContent = 'Token tidak valid';
        return;
      }

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('btnSubmit');
      const message = document.getElementById('message');

      if (password.length < 6) {
        message.className = 'message error';
        message.textContent = 'Password minimal 6 karakter';
        return;
      }

      if (password !== confirmPassword) {
        message.className = 'message error';
        message.textContent = 'Konfirmasi password tidak cocok';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-btn"></span> Mereset...';
      message.className = 'message';
      message.textContent = '';

      try {
        const response = await fetch(API_URL + '/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });

        const data = await response.json();

        if (data.success) {
          message.className = 'message success';
          message.innerHTML = '✓ ' + data.message + '<br><br><a href="/" style="color:#27ae60;font-weight:bold;">Klik di sini untuk login</a>';
          document.querySelector('.form').style.display = 'none';
        } else {
          message.className = 'message error';
          message.textContent = data.error || 'Terjadi kesalahan';
          btn.disabled = false;
          btn.innerHTML = 'Reset Password';
        }
      } catch (error) {
        console.error('Reset password error:', error);
        message.className = 'message error';
        message.textContent = 'Terjadi kesalahan: ' + error.message;
        btn.disabled = false;
        btn.innerHTML = 'Reset Password';
      }
    }
  </script>
</body>
</html>
