<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistem Manajemen Laboratorium - Login">
  <meta name="theme-color" content="#0F172A">

  <title>Login — Lab Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  
  <link rel="manifest" href="/manifest.json">

  
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Lab Management System</h1>
      <p>Silakan login untuk melanjutkan</p>

      <form class="login-form" onsubmit="handleLogin(event)">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>

      <div class="login-forgot-link">
        <a href="/pages/auth/forgot-password.html">Lupa Password?</a>
      </div>

      <div class="login-info">
        <strong>Catatan:</strong>
        <div>Gunakan akun yang telah terdaftar untuk login</div>
      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script>
    if (localStorage.getItem('token')) {
      sessionStorage.setItem('token', localStorage.getItem('token'));
      sessionStorage.setItem('user', localStorage.getItem('user'));
      localStorage.removeItem('token');
      localStorage.removeItem('user');
    }
    async function handleLogin(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(API_URL + '/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          alert('Login gagal: ' + (data.error || 'Unknown error'));
          return;
        }

        sessionStorage.setItem('token', data.token);
        sessionStorage.setItem('user', JSON.stringify(data.user));

        if (data.user.role === 'admin') {
          window.location.href = '/pages/admin/dashboard.html';
        } else {
          window.location.href = '/pages/user/dashboard.html';
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Terjadi kesalahan: ' + error.message);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const token = sessionStorage.getItem('token');
      if (token) {
        try {
          const user = JSON.parse(sessionStorage.getItem('user'));
          if (user && user.role === 'admin') {
            window.location.href = '/pages/admin/dashboard.html';
          } else if (user) {
            window.location.href = '/pages/user/dashboard.html';
          }
        } catch (e) {
          sessionStorage.removeItem('token');
          sessionStorage.removeItem('user');
        }
      }
    });
  </script>

  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('✓ Service Worker registered:', registration);
          })
          .catch(error => {
            console.log('✗ Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
