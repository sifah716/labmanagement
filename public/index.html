<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistem Manajemen Laboratorium - Login">
  <meta name="theme-color" content="#667eea">
  
  <title>Login - Lab Management System</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icon-192.png">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    
    .login-box h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    
    .login-box p {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 30px;
    }
    
    .login-form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    .login-form input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    
    .login-form button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .login-form button:hover {
      background: #5568d3;
    }
    
    .login-info {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 5px;
      font-size: 13px;
      color: #495057;
    }
    
    .login-info strong {
      display: block;
      margin-bottom: 5px;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>🔐 Lab Management System</h1>
      <p>Silakan login untuk melanjutkan</p>
      
      <form class="login-form" onsubmit="handleLogin(event)">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      
      <div class="login-info">
        <strong> 📝 Catatan: </strong>
        <div> Gunakan akun yang telah terdaftar untuk login </div>
        <div> Hubungi administrator jika lupa password </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch(API_URL + '/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          alert('Login gagal: ' + (data.error || 'Unknown error'));
          return;
        }
        
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // Redirect based on role
        if (data.user.role === 'admin') {
          window.location.href = '/pages/admin/dashboard.html';
        } else {
          window.location.href = '/pages/user/dashboard.html';
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Terjadi kesalahan: ' + error.message);
      }
    }

    // Redirect jika sudah login
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (token) {
        const user = JSON.parse(localStorage.getItem('user'));
        if (user.role === 'admin') {
          window.location.href = '/pages/admin/dashboard.html';
        } else {
          window.location.href = '/pages/user/dashboard.html';
        }
      }
    });
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('✓ Service Worker registered:', registration);
          })
          .catch(error => {
            console.log('✗ Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
