version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - data:/app/data
      - logs:/app/logs
    restart: unless-stopped

volumes:
  data:
  logs:
